<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Sign in to your HealthPlus Pharmacy account.">
<title>Sign In — HealthPlus Pharmacy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<header>
<nav class="site-nav" id="site-nav">
  <a href="index.html" class="nav-logo"><div class="nav-logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2A5.5 5.5 0 0 0 7.5 3 5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg></div><span class="nav-logo-text">Health<em>Plus</em></span></a>
  <ul class="nav-links" id="nav-links"><li><a href="index.html">Home</a></li><li><a href="order-online.html">Shop</a></li><li><a href="services.html">Categories</a></li><li><a href="blog.html">Health Tips</a></li><li><a href="about-us.html">About</a></li><li><a href="register.html" class="nav-cta">Register</a></li></ul>
  <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
</nav>
</header>
<main>
  <section class="auth-page-grid">
    <div class="auth-panel auth-panel--page">
      <div class="section-label"><span>Welcome Back</span></div>
      <h1 style="font-family:var(--font-display);font-size:clamp(28px,4vw,40px);margin:8px 0 8px;">Sign in to HealthPlus</h1>
      <p style="font-size:14px;color:var(--sage);margin-bottom:24px;">Access your orders, saved details, and faster checkout.</p>
      <div class="auth-error" id="auth-error"></div>
      <form id="login-form" novalidate>
        <div class="form-group"><label for="login-email">Email Address</label><input type="email" id="login-email" placeholder="you@example.com" autocomplete="email" required></div>
        <div class="form-group"><label for="login-password">Password</label><input type="password" id="login-password" placeholder="Your password" autocomplete="current-password" required></div>
        <button type="submit" class="btn-primary btn-block">Sign In to HealthPlus</button>
      </form>
      <p class="guest-link" style="margin-top:18px;">New customer? <a href="register.html">Create a free account</a></p>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>
<script src="js/security.js" defer></script>
<script src="js/core.js" defer></script>
<script src="js/auth.js" defer></script>
<script src="js/wire.js" defer></script>
</body>
</html>
